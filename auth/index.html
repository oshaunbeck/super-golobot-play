<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Super Golobot sign-in</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #1c1720; color: #ece4cc;
         font: 16px/1.5 system-ui, sans-serif; text-align: center; padding: 16px; box-sizing: border-box; }
  b { color: #ffd060; }
</style>
</head>
<body>
<p id="msg">Signing you in...</p>
<script>
// Discord sends the player back here (Supabase PKCE: ?code=...). Hand the
// code to the game window that opened this pop-up, then close. The code is
// useless without the secret the game kept, so posting it is safe.
(function () {
  var q = new URLSearchParams(location.search);
  var h = new URLSearchParams(location.hash.replace(/^#/, ''));
  var code = q.get('code') || '';
  var err = q.get('error_description') || h.get('error_description') || q.get('error') || h.get('error') || '';
  var msg = document.getElementById('msg');
  if (window.opener && !window.opener.closed) {
    try { window.opener.postMessage({ jgAuth: true, code: code, error: err }, '*'); } catch (e) {}
    msg.innerHTML = code ? '<b>Signed in.</b> Going back to the game...' : 'Sign-in cancelled. You can close this window.';
    setTimeout(function () { window.close(); }, 600);
  } else {
    msg.innerHTML = code ? '<b>Signed in.</b> You can close this tab and go back to the game.'
                         : 'Sign-in cancelled. You can close this tab.';
  }
})();
</script>
</body>
</html>
